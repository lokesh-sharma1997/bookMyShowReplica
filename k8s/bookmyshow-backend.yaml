apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookmyshow-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookmyshow-backend
  template:
    metadata:
      labels:
        app: bookmyshow-backend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: backend
          image: infocats4uai/bookmyshow-backend:30
          ports:
            - containerPort: 8080
          env:
            - name: BOOKMYSHOW
              value: "bookmyshow"
            - name: BOOKMYSHOWSERVICE
              value: "bookmyshowservice"
            - name: DB_IP
              value: "172.31.252.101"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "bookMyShowDev"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASS
              value: "postgres"
            - name: SECRET
              value: "U29tZVNlY3JldEtleVRoYXRJc1ZlcnlTZWN1cmUhISE="
---
apiVersion: v1
kind: Service
metadata:
  name: bookmyshow-backend-service
spec:
  type: NodePort
  selector:
    app: bookmyshow-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080